<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">Context budget guard — less noise, keep the clues</title><desc id="hero-desc">Original concept illustration: a large tool result becomes a useful preview and recoverable artifact. Experimental operating skill and benchmark kit only; separate runtime is not shipped and activation is blocked. This is not benchmark data.</desc>
<defs><pattern id="hero-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1D304A" stroke-width=".5"/></pattern>
<linearGradient id="hero-wash" x2="1" y2="1"><stop stop-color="#102D3B"/><stop offset="1" stop-color="#080F1D"/></linearGradient>
<marker id="hero-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6C92B2" stroke-width="1.7"/></marker></defs>
<rect width="1200" height="520" rx="24" fill="#080F1D"/>
<rect width="1200" height="520" rx="24" fill="url(#hero-grid)" opacity=".45"/>
<rect x="1" y="1" width="1198" height="518" rx="23" fill="none" stroke="#253651"/>
<text x="48" y="56" fill="#5DE3EF" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="700" text-anchor="start">CONTEXT / BUDGET / GUARD</text><rect x="939" y="34" width="213" height="32" rx="16" fill="#080F1D" stroke="#FFD084"/><circle cx="955" cy="50" r="3" fill="#FFD084"/><text x="967" y="56" fill="#FFD084" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="start">EXPERIMENTAL</text><text x="48" y="161" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="72" font-weight="700" text-anchor="start">Less noise.</text><text x="48" y="244" fill="#6EE7BC" font-family="Arial,Liberation Sans,sans-serif" font-size="72" font-weight="700" text-anchor="start">Keep the clues.</text><text x="51" y="299" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="24" font-weight="400" text-anchor="start">Bound the output. Preserve the diagnostic.</text><text x="51" y="333" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="24" font-weight="400" text-anchor="start">Recover the detail when it matters.</text><rect x="48" y="397" width="267" height="32" rx="16" fill="#080F1D" stroke="#5DE3EF"/><circle cx="64" cy="413" r="3" fill="#5DE3EF"/><text x="76" y="419" fill="#5DE3EF" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="start">SKILL + BENCHMARK KIT</text><rect x="335" y="397" width="238" height="32" rx="16" fill="#080F1D" stroke="#BCABFF"/><circle cx="351" cy="413" r="3" fill="#BCABFF"/><text x="363" y="419" fill="#BCABFF" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="start">RUNTIME NOT SHIPPED</text><rect x="790" y="114" width="300" height="227" rx="16" fill="#0B1424" stroke="#31415C"/><rect x="770" y="130" width="300" height="227" rx="16" fill="#0E192A" stroke="#31415C"/><rect x="750" y="146" width="300" height="227" rx="16" fill="#101C2F" stroke="#253651"/><circle cx="774" cy="168" r="4" fill="#FF8FA8"/><circle cx="791" cy="168" r="4" fill="#FFD084"/><circle cx="808" cy="168" r="4" fill="#6EE7BC"/><rect x="772" y="194" width="206" height="5" rx="2" fill="#2A3C55" stroke="#2A3C55"/><rect x="772" y="217" width="154" height="5" rx="2" fill="#2A3C55" stroke="#2A3C55"/><rect x="772" y="240" width="232" height="5" rx="2" fill="#2A3C55" stroke="#2A3C55"/><rect x="772" y="263" width="185" height="5" rx="2" fill="#2A3C55" stroke="#2A3C55"/><rect x="772" y="286" width="221" height="5" rx="2" fill="#2A3C55" stroke="#2A3C55"/><rect x="772" y="309" width="140" height="5" rx="2" fill="#2A3C55" stroke="#2A3C55"/><rect x="729" y="264" width="366" height="58" rx="12" fill="#11322E" stroke="#6EE7BC"/><circle cx="753" cy="293" r="6" fill="#6EE7BC"/><text x="773" y="300" fill="#6EE7BC" font-family="DejaVu Sans Mono,monospace" font-size="17" font-weight="700" text-anchor="start">exit_code: 7  /  keep this</text><path d="M870 376V398H1040" fill="none" stroke="#BCABFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hero-arrow)"/><rect x="1001" y="374" width="117" height="64" rx="12" fill="#211E38" stroke="#BCABFF"/><text x="1059" y="413" fill="#BCABFF" font-family="Arial,Liberation Sans,sans-serif" font-size="18" font-weight="700" text-anchor="middle">detail</text><text x="48" y="492" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="16" font-weight="400" text-anchor="start">ACTIVATION BLOCKED  /  Design illustration, not measured savings</text></svg>
