<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="roadmap-title roadmap-desc">
<title id="roadmap-title">The designed plan — correctness is the gate</title><desc id="roadmap-desc">Six-stage promotion roadmap: document invariants, build an isolated candidate and review, repair and re-review, paired offline replay, task and compaction evaluation, and explicitly approved rollout. Current native review is rejected; later stages are not completed.</desc>
<defs><pattern id="roadmap-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1D304A" stroke-width=".5"/></pattern>
<linearGradient id="roadmap-wash" x2="1" y2="1"><stop stop-color="#102D3B"/><stop offset="1" stop-color="#080F1D"/></linearGradient>
<marker id="roadmap-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6C92B2" stroke-width="1.7"/></marker></defs>
<rect width="1200" height="730" rx="24" fill="#080F1D"/>
<rect width="1200" height="730" rx="24" fill="url(#roadmap-grid)" opacity=".45"/>
<rect x="1" y="1" width="1198" height="728" rx="23" fill="none" stroke="#253651"/>
<text x="48" y="52" fill="#5DE3EF" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700" text-anchor="start">02 / THE PLAN</text><text x="48" y="106" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="39" font-weight="700" text-anchor="start">Earn the next step. No victory laps.</text><text x="48" y="145" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">Documentation exists. The isolated candidate was rejected. Production is not next.</text><path d="M376 294H422" fill="none" stroke="#253651" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roadmap-arrow)"/><path d="M752 294H798" fill="none" stroke="#253651" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roadmap-arrow)"/><path d="M964 391V436" fill="none" stroke="#253651" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roadmap-arrow)"/><path d="M800 531H778" fill="none" stroke="#253651" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roadmap-arrow)"/><path d="M424 531H378" fill="none" stroke="#253651" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roadmap-arrow)"/><rect x="48" y="201" width="328" height="190" rx="16" fill="#101C2F" stroke="#253651"/><text x="70" y="235" fill="#5DE3EF" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" text-anchor="start">01</text><text x="70" y="274" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="25" font-weight="700" text-anchor="start">Define invariants</text><text x="70" y="309" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">State what must survive.</text><text x="70" y="334" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Capture real reproductions.</text><text x="70" y="369" fill="#5DE3EF" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="start">DOCUMENTED</text><rect x="424" y="201" width="352" height="190" rx="16" fill="#101C2F" stroke="#FF8FA8"/><text x="446" y="235" fill="#FF8FA8" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" text-anchor="start">02</text><text x="446" y="274" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="25" font-weight="700" text-anchor="start">Build + review</text><text x="446" y="309" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Isolated implementation.</text><text x="446" y="334" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Exact-byte independent review.</text><text x="446" y="369" fill="#FF8FA8" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="start">REJECTED</text><rect x="800" y="201" width="328" height="190" rx="16" fill="#101C2F" stroke="#253651"/><text x="822" y="235" fill="#FFD084" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" text-anchor="start">03</text><text x="822" y="274" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="25" font-weight="700" text-anchor="start">Repair + re-review</text><text x="822" y="309" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Resolve #6, #7 and #8.</text><text x="822" y="334" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">No acceptance by test count.</text><text x="822" y="369" fill="#FFD084" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="start">NEXT / NOT DONE</text><rect x="800" y="438" width="328" height="190" rx="16" fill="#101C2F" stroke="#253651"/><text x="822" y="472" fill="#BCABFF" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" text-anchor="start">04</text><text x="822" y="511" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="25" font-weight="700" text-anchor="start">Replay across code</text><text x="822" y="546" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Paired inputs + semantic oracles.</text><text x="822" y="571" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Protocol only; harness not built.</text><text x="822" y="606" fill="#BCABFF" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="start">PROPOSED</text><rect x="424" y="438" width="352" height="190" rx="16" fill="#101C2F" stroke="#253651"/><text x="446" y="472" fill="#FFD084" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" text-anchor="start">05</text><text x="446" y="511" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="25" font-weight="700" text-anchor="start">Evaluate real tasks</text><text x="446" y="546" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Scope model runs and cost.</text><text x="446" y="571" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Study compaction separately.</text><text x="446" y="606" fill="#FFD084" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="start">NOT RUN</text><rect x="48" y="438" width="328" height="190" rx="16" fill="#101C2F" stroke="#253651"/><text x="70" y="472" fill="#A8B9CF" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" text-anchor="start">06</text><text x="70" y="511" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="25" font-weight="700" text-anchor="start">Controlled rollout</text><text x="70" y="546" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Explicit approval + rollback.</text><text x="70" y="571" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Verify the loaded backend.</text><text x="70" y="606" fill="#A8B9CF" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="start">LOCKED</text><text x="48" y="676" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start">Offline failure characterization can run earlier; a failing oracle still blocks promotion.</text><text x="48" y="702" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="16" font-weight="400" text-anchor="start">CURRENT STATE  /  Experimental · runtime absent here · activation BLOCKED</text></svg>
