<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="evaluation-title evaluation-desc">
<title id="evaluation-title">Evaluate fidelity before efficiency</title><desc id="evaluation-desc">Proposed, unimplemented benchmark: Python, TypeScript and JavaScript, Rust, and SQL/config/log cases feed identical unbudgeted, historical spill and candidate arms. Correctness is a veto before bytes, recovery calls, latency, tokens or cost can support an efficiency claim.</desc>
<defs><pattern id="evaluation-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1D304A" stroke-width=".5"/></pattern>
<linearGradient id="evaluation-wash" x2="1" y2="1"><stop stop-color="#102D3B"/><stop offset="1" stop-color="#080F1D"/></linearGradient>
<marker id="evaluation-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6C92B2" stroke-width="1.7"/></marker></defs>
<rect width="1200" height="790" rx="24" fill="#080F1D"/>
<rect width="1200" height="790" rx="24" fill="url(#evaluation-grid)" opacity=".45"/>
<rect x="1" y="1" width="1198" height="788" rx="23" fill="none" stroke="#253651"/>
<text x="48" y="52" fill="#5DE3EF" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700" text-anchor="start">03 / THE EVALUATION</text><text x="48" y="106" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="39" font-weight="700" text-anchor="start">Small is not the score. Correct is.</text><text x="48" y="145" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">A shorter result that loses the diagnosis is a failed result.</text><rect x="921" y="33" width="231" height="32" rx="16" fill="#080F1D" stroke="#FFD084"/><circle cx="937" cy="49" r="3" fill="#FFD084"/><text x="949" y="55" fill="#FFD084" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="start">PROTOCOL ONLY</text><rect x="48" y="188" width="244" height="56" rx="12" fill="#101C2F" stroke="#253651"/><text x="170.0" y="223" fill="#5DE3EF" font-family="DejaVu Sans Mono,monospace" font-size="17" font-weight="700" text-anchor="middle">PYTHON</text><rect x="308" y="188" width="280" height="56" rx="12" fill="#101C2F" stroke="#253651"/><text x="448.0" y="223" fill="#6EE7BC" font-family="DejaVu Sans Mono,monospace" font-size="17" font-weight="700" text-anchor="middle">TYPESCRIPT / JS</text><rect x="604" y="188" width="200" height="56" rx="12" fill="#101C2F" stroke="#253651"/><text x="704.0" y="223" fill="#BCABFF" font-family="DejaVu Sans Mono,monospace" font-size="17" font-weight="700" text-anchor="middle">RUST</text><rect x="820" y="188" width="332" height="56" rx="12" fill="#101C2F" stroke="#253651"/><text x="986.0" y="223" fill="#FFD084" font-family="DejaVu Sans Mono,monospace" font-size="17" font-weight="700" text-anchor="middle">SQL / CONFIG / LOGS</text><text x="48" y="285" fill="#A8B9CF" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="700" text-anchor="start">SAME INPUTS  /  PINNED VERSIONS  /  MATCHED BUDGETS</text><rect x="48" y="310" width="328" height="134" rx="16" fill="#101C2F" stroke="#253651"/><text x="70" y="352" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="25" font-weight="700" text-anchor="start">Unbudgeted</text><text x="70" y="387" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Reference output</text><text x="70" y="412" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Kept inside controlled replay</text><rect x="424" y="310" width="352" height="134" rx="16" fill="#101C2F" stroke="#253651"/><text x="446" y="352" fill="#BCABFF" font-family="Arial,Liberation Sans,sans-serif" font-size="25" font-weight="700" text-anchor="start">Historical spill</text><text x="446" y="387" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Pinned old behavior</text><text x="446" y="412" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">An actual comparison arm</text><rect x="800" y="310" width="328" height="134" rx="16" fill="#101C2F" stroke="#253651"/><text x="822" y="352" fill="#5DE3EF" font-family="Arial,Liberation Sans,sans-serif" font-size="25" font-weight="700" text-anchor="start">Candidate guard</text><text x="822" y="387" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Exact runtime fingerprint</text><text x="822" y="412" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start">Use the real isolated adapter</text><path d="M600 449V484" fill="none" stroke="#6EE7BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#evaluation-arrow)"/><rect x="48" y="486" width="1104" height="144" rx="16" fill="#102A27" stroke="#35735F"/><text x="72" y="525" fill="#6EE7BC" font-family="DejaVu Sans Mono,monospace" font-size="17" font-weight="700" text-anchor="start">CORRECTNESS IS A VETO, NOT AN AVERAGE</text><text x="72" y="565" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">Notes + trust boundaries   /   original failure status   /   receipt lifetime</text><text x="72" y="597" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">Media order   /   recoverable detail   /   one tool execution</text><rect x="48" y="656" width="1104" height="61" rx="16" fill="#19263A" stroke="#253651"/><text x="72" y="693" fill="#5DE3EF" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" text-anchor="start">THEN MEASURE</text><text x="271" y="693" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">bytes · recovery calls · latency · actual tokens / cost when available</text><text x="48" y="762" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="16" font-weight="400" text-anchor="start">NOT RUN  /  No scores, savings or production approval are implied by this diagram.</text></svg>
