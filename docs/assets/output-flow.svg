<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="output-flow-title output-flow-desc">
<title id="output-flow-title">How output budgeting should work</title><desc id="output-flow-desc">Design target: separate trusted metadata from tool data, reserve its complete rendered footprint, apply per-result and aggregate limits, send a bounded preview to the model, and retain recoverable private redacted details. The runtime candidate is rejected, not shipped here.</desc>
<defs><pattern id="output-flow-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1D304A" stroke-width=".5"/></pattern>
<linearGradient id="output-flow-wash" x2="1" y2="1"><stop stop-color="#102D3B"/><stop offset="1" stop-color="#080F1D"/></linearGradient>
<marker id="output-flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6C92B2" stroke-width="1.7"/></marker></defs>
<rect width="1200" height="830" rx="24" fill="#080F1D"/>
<rect width="1200" height="830" rx="24" fill="url(#output-flow-grid)" opacity=".45"/>
<rect x="1" y="1" width="1198" height="828" rx="23" fill="none" stroke="#253651"/>
<text x="48" y="52" fill="#5DE3EF" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700" text-anchor="start">01 / THE DESIGN</text><text x="48" y="106" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="39" font-weight="700" text-anchor="start">Keep the signal. Recover the rest.</text><text x="48" y="145" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">Tool output is data. Runtime notices are metadata. Do not confuse the two.</text><path d="M352 301H423" fill="none" stroke="#5DE3EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#output-flow-arrow)"/><path d="M776 301H847" fill="none" stroke="#6EE7BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#output-flow-arrow)"/><path d="M600 430V510H422" fill="none" stroke="#BCABFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#output-flow-arrow)"/><path d="M1000 430V489" fill="none" stroke="#6EE7BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#output-flow-arrow)"/><path d="M939 682V732H267V684" fill="none" stroke="#BCABFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#output-flow-arrow)"/><rect x="48" y="204" width="304" height="226" rx="16" fill="#101C2F" stroke="#253651"/><text x="72" y="246" fill="#5DE3EF" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" text-anchor="start">TOOL RESULT</text><text x="72" y="291" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="25" font-weight="700" text-anchor="start">Logs. Source. Diffs.</text><text x="72" y="335" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">Ordinary untrusted body</text><text x="72" y="366" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">Original exit/error status</text><text x="72" y="397" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">Media that must survive</text><rect x="424" y="204" width="352" height="226" rx="16" fill="#10272F" stroke="#346B70"/><text x="448" y="246" fill="#5DE3EF" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" text-anchor="start">BUDGET + PRESERVE</text><text x="448" y="291" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="25" font-weight="700" text-anchor="start">Reserve before spill.</text><text x="448" y="335" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">Per-result + aggregate checks</text><text x="448" y="366" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">Complete rendered byte count</text><text x="448" y="397" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">Call-ID-owned notice suffix</text><rect x="848" y="204" width="304" height="226" rx="16" fill="#102A27" stroke="#35735F"/><text x="872" y="246" fill="#6EE7BC" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" text-anchor="start">MODEL-VISIBLE</text><text x="872" y="291" fill="#EFF6FF" font-family="Arial,Liberation Sans,sans-serif" font-size="24" font-weight="700" text-anchor="start">Useful, not enormous.</text><text x="872" y="335" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">Bounded preview + status</text><text x="872" y="366" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">Recoverable artifact pointer</text><text x="872" y="397" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">No repeated tool execution</text><rect x="48" y="512" width="374" height="172" rx="16" fill="#1A2036" stroke="#6D609B"/><text x="72" y="552" fill="#BCABFF" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="700" text-anchor="start">RECOVERABLE DETAIL</text><text x="72" y="592" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">Private + redacted artifact</text><text x="72" y="622" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">Read a targeted offset/limit</text><text x="72" y="652" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start">Storage alone is not visibility.</text><rect x="474" y="552" width="678" height="132" rx="16" fill="#102A27" stroke="#35735F"/><text x="496" y="590" fill="#6EE7BC" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="700" text-anchor="start">TRUSTED RUNTIME NOTICE</text><text x="496" y="626" fill="#6EE7BC" font-family="Arial,Liberation Sans,sans-serif" font-size="22" font-weight="700" text-anchor="start">Exactly once. Outside the untrusted wrapper.</text><text x="496" y="657" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start">Reserve its space; never restore it after the final cap.</text><rect x="474" y="493" width="678" height="44" rx="10" fill="#0B1424" stroke="#253651"/><text x="486" y="521" fill="#A8B9CF" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400" text-anchor="start">&lt;untrusted_tool_result&gt;preview + status&lt;/untrusted_tool_result&gt;</text><text x="391" y="762" fill="#BCABFF" font-family="Arial,Liberation Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start">Recover only the additional detail the task needs.</text><text x="48" y="802" fill="#A8B9CF" font-family="Arial,Liberation Sans,sans-serif" font-size="16" font-weight="400" text-anchor="start">DESIGN TARGET  /  Valid receipts and mandatory controls retain their defined exceptions.</text></svg>
