[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spillway"
version = "0.4.0"
description = "Verifiable fidelity-first tool-output budgeting, recovery artifacts, and MCP/Hermes adapters."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Ricardo Margalho" },
]
keywords = ["llm", "agents", "mcp", "context", "tool-output", "budgeting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Repository = "https://github.com/seatrunk/context-budget-guard"
Issues = "https://github.com/seatrunk/context-budget-guard/issues"

[project.scripts]
spillway = "spillway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spillway*"]
