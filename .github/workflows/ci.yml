name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository contracts and public-data hygiene
        run: python3 scripts/check_repo.py
      - name: Minimal lint (compileall)
        run: python3 -m compileall -q spillway adapters benchmarks scripts tests
      - name: Core, adapters, invariants and tooling
        run: python3 -m unittest discover -s tests -v
      - name: Offline replay (no model, no network)
        run: |
          python3 benchmarks/replay/replay.py --out "$RUNNER_TEMP/offline-replay.json"
          cmp "$RUNNER_TEMP/offline-replay.json" benchmarks/replay/results/offline-replay.json

  python-compat:
    name: python-compat (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, invariant and adapter tests
        run: python -m unittest discover -s tests
      - name: Package install smoke test (wheel contains only the spillway package)
        run: |
          set -eu
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet .
          "$RUNNER_TEMP/venv/bin/spillway" --version
          site=$("$RUNNER_TEMP/venv/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          test ! -e "$site/adapters"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/spillway" mcp --mode enforce --log-dir "$RUNNER_TEMP/spw" -- \
                 "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/tests/adapters/fake_mcp_server.py") \
            | grep -q spillway_read_artifact

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks 8.30.1 (official binary, pinned SHA-256) over the full history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 --log-opts=--all .

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor 1.32.0 (PyPI, --require-hashes) on workflows
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --only-binary :all: -r .github/zizmor-requirements.txt
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline .github/

  pr-policy:
    name: pr-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require useful verification and a privacy acknowledgement
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pr = event['pull_request']
          if pr['user']['login'] == 'dependabot[bot]' and pr['head']['ref'].startswith('dependabot/github_actions/'):
              print('Dependency-only bot PR: CODEOWNER review and repository checks still apply.')
              raise SystemExit(0)
          body = pr.get('body') or ''
          sections = ['Summary', 'Verification', 'Benchmark impact', 'Privacy and rollout']
          for heading in sections:
              match = re.search(r'^## ' + re.escape(heading) + r'\s*\n(.*?)(?=^## |\Z)', body, re.M | re.S)
              if not match or not match.group(1).strip():
                  raise SystemExit('Missing or empty required PR section: ' + heading)
          acknowledgement = '- [x] I checked that this contribution contains no secrets or private transcripts.'
          if acknowledgement.lower() not in body.lower():
              raise SystemExit('Check the privacy acknowledgement after inspecting the diff.')
          print('PR structure and privacy acknowledgement: OK; human review remains required.')
          PY
