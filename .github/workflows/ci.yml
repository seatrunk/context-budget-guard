name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository contracts and public-data hygiene
        run: python3 scripts/check_repo.py
      - name: Lint mínimo (compileall)
        run: python3 -m compileall -q cbg adapters benchmarks scripts tests
      - name: Núcleo, adaptadores, invariantes e tooling
        run: python3 -m unittest discover -s tests -v
      - name: Replay offline (sem modelo, sem rede)
        run: |
          python3 benchmarks/replay/replay.py --out "$RUNNER_TEMP/offline-replay.json"
          cmp "$RUNNER_TEMP/offline-replay.json" benchmarks/replay/results/offline-replay.json

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks 8.30.1 (binário oficial, SHA-256 fixo) no histórico inteiro
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 --log-opts=--all .

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor 1.32.0 (PyPI, --require-hashes) nos workflows
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --only-binary :all: -r .github/zizmor-requirements.txt
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline .github/

  pr-policy:
    name: pr-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require useful verification and a privacy acknowledgement
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pr = event['pull_request']
          if pr['user']['login'] == 'dependabot[bot]' and pr['head']['ref'].startswith('dependabot/github_actions/'):
              print('Dependency-only bot PR: CODEOWNER review and repository checks still apply.')
              raise SystemExit(0)
          body = pr.get('body') or ''
          sections = ['Summary', 'Verification', 'Benchmark impact', 'Privacy and rollout']
          for heading in sections:
              match = re.search(r'^## ' + re.escape(heading) + r'\s*\n(.*?)(?=^## |\Z)', body, re.M | re.S)
              if not match or not match.group(1).strip():
                  raise SystemExit('Missing or empty required PR section: ' + heading)
          acknowledgement = '- [x] I checked that this contribution contains no secrets or private transcripts.'
          if acknowledgement.lower() not in body.lower():
              raise SystemExit('Check the privacy acknowledgement after inspecting the diff.')
          print('PR structure and privacy acknowledgement: OK; human review remains required.')
          PY
