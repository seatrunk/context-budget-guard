name: Feature request
description: Propose a focused change to the specification or tooling.
title: "[enhancement] "
labels: [needs-triage, enhancement]
body:
  - type: markdown
    attributes:
      value: "Use synthetic evidence only. Activation is blocked. Send sensitive reports through Security, not this form."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no secrets, private transcripts, profile contents, private paths, or session identifiers.
          required: true
  - type: input
    id: version
    attributes:
      label: Version and context
      description: Repository revision and relevant runtime version, or not applicable. Do not include private identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include a minimal synthetic example of the current limitation and desired result.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Proposed behavior and trade-offs
      description: Separate observations from assumptions. Link only public, privacy-reviewed evidence.
    validations:
      required: true
