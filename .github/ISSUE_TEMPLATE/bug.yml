name: Bug report
description: Report incorrect behavior with synthetic evidence.
title: "[bug] "
labels: [needs-triage, bug]
body:
  - type: markdown
    attributes:
      value: "Use synthetic evidence only. Activation is blocked. Send sensitive reports through Security, not this form."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no secrets, private transcripts, profile contents, private paths, or session identifiers.
          required: true
  - type: input
    id: version
    attributes:
      label: Version and context
      description: Repository revision and relevant runtime version, or not applicable. Do not include private identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include the smallest synthetic input and steps that reproduce the difference.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Expected and observed behavior
      description: Separate observations from assumptions. Link only public, privacy-reviewed evidence.
    validations:
      required: true
